[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semeval2015-task11"
version = "1.0.0"
description = "Reconstruct SemEval-2015 Task 11 annotations and tweet text"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
    "flake8>=7,<8",
    "pytest>=8,<9",
]

[project.scripts]
semeval-task11 = "semeval_task11.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

